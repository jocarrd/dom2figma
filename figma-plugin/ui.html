<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 12px/1.45 Inter, system-ui, sans-serif }
  body { margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; height: 100vh; box-sizing: border-box }
  h1 { font-size: 13px; margin: 0; font-weight: 600 }
  p { margin: 0; opacity: .7 }
  code { background: rgba(128,128,128,.16); padding: 1px 4px; border-radius: 4px }
  textarea { flex: 1; resize: none; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
             padding: 8px; border-radius: 8px; border: 1px solid rgba(128,128,128,.35);
             background: transparent; color: inherit }
  .row { display: flex; gap: 8px }
  .row > * { flex: 1; min-width: 0 }
  input { padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(128,128,128,.35);
          background: transparent; color: inherit; font: inherit }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: #0d99ff; color: #fff;
           font: 600 12px/1 Inter, system-ui, sans-serif; cursor: pointer }
  button:disabled { opacity: .5; cursor: default }
  #status { min-height: 16px }
  #status.err { color: #d33 }
</style>

<h1>dom2figma</h1>
<p>Paste the <code>.figma.json</code> produced by <code>npx dom2figma &lt;url&gt;</code>.</p>
<textarea id="payload" placeholder='{"w":1440,"h":6534,"bg":[1,1,1,1],"fonts":[...],"nodes":[...]}'></textarea>
<div class="row">
  <input id="name" placeholder="Frame name (optional)">
  <input id="page" placeholder="Page (default: dom2figma)">
</div>
<div class="row">
  <input id="x" placeholder="x" value="0">
  <input id="y" placeholder="y" value="0">
  <button id="go">Build</button>
</div>
<p id="status"></p>

<script>
  const $ = (id) => document.getElementById(id)
  const status = $('status')
  $('go').onclick = () => {
    const payload = $('payload').value.trim()
    if (!payload) { status.textContent = 'Nothing to build.'; status.className = 'err'; return }
    status.className = ''
    status.textContent = 'Building…'
    $('go').disabled = true
    parent.postMessage({ pluginMessage: {
      type: 'build',
      payload,
      name: $('name').value.trim() || undefined,
      page: $('page').value.trim() || undefined,
      x: Number($('x').value) || 0,
      y: Number($('y').value) || 0
    } }, '*')
  }
  onmessage = (e) => {
    const m = e.data.pluginMessage
    if (!m) return
    $('go').disabled = false
    if (m.type === 'done') {
      const s = m.summary
      status.className = ''
      status.textContent = s.boxes + ' boxes · ' + s.texts + ' texts · ' + s.images + ' images'
        + (s.imageErrors ? ' · ' + s.imageErrors + ' images failed' : '')
    } else {
      status.className = 'err'
      status.textContent = m.message
    }
  }
</script>
